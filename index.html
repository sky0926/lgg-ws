<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态元素周期表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        input {
            padding: 12px 20px;
            width: 300px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            grid-gap: 8px;
            margin-bottom: 30px;
        }
        
        .element {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 5px;
            position: relative;
            overflow: hidden;
        }
        
        .element:hover {
            transform: scale(1.08);
            z-index: 10;
        }
        
        .element-number {
            font-size: 0.7rem;
            align-self: flex-start;
        }
        
        .element-symbol {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 2px 0;
        }
        
        .element-name {
            font-size: 0.6rem;
        }
        
        .element-weight {
            font-size: 0.6rem;
        }
        
        .empty {
            visibility: hidden;
        }
        
        .details-panel {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            display: none;
            margin-top: 20px;
        }
        
        .details-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .details-symbol {
            font-size: 3rem;
            font-weight: bold;
            margin-right: 20px;
            padding: 15px;
            border-radius: 10px;
            color: white;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .details-name {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .details-number {
            font-size: 1.2rem;
            margin-left: auto;
            background: #eee;
            padding: 8px 15px;
            border-radius: 20px;
        }
        
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .detail-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
        }
        
        .detail-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-size: 1.1rem;
            font-weight: bold;
        }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        
        @media (max-width: 1100px) {
            .periodic-table {
                grid-template-columns: repeat(10, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .periodic-table {
                grid-template-columns: repeat(5, 1fr);
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 80%;
            }
            
            input {
                width: 80%;
            }
        }
        
        .animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>

        // 渲染元素周期表
        function renderPeriodicTable() {
            const table = document.getElementById('periodicTable');
            table.innerHTML = '';
            
            // 创建118个格子
            for (let i = 1; i <= 118; i++) {
                const element = elements.find(el => el.number === i);
                const cell = document.createElement('div');
                
                if (element) {
                    cell.className = 'element';
                    cell.style.backgroundColor = categoryColors[element.category];
                    cell.style.gridColumn = element.x;
                    cell.style.gridRow = element.y;
                    
                    cell.innerHTML = `
                        <div class="element-number">${element.number}</div>
                        <div class="element-symbol">${element.symbol}</div>
                        <div class="element-name">${element.name}</div>
                        <div class="element-weight">${element.weight}</div>
                    `;
                    
                    cell.addEventListener('click', () => showElementDetails(element));
                } else {
                    cell.className = 'empty';
                }
                
                table.appendChild(cell);
            }
        }

                    <div class="details-symbol" style="background-color: ${categoryColors[element.category]}">${element.symbol}</div>

        // 获取类别名称
        function getCategoryName(category) {
            const names = {
                "nonmetal": "非金属",
                "alkali": "碱金属",
                "alkaline": "碱土金属",
                "transition": "过渡金属",
                "metalloid": "类金属",
                "halogen": "卤素",
                "noble": "惰性气体",
                "lanthanide": "镧系元素",
                "actinide": "锕系元素",
                "post-transition": "后过渡金属"
            };
            return names[category] || "未知";
        }

        // 获取周期
        function getPeriod(number) {
            if (number <= 2) return 1;
            if (number <= 10) return 2;
            if (number <= 18) return 3;
            if (number <= 36) return 4;
            if (number <= 54) return 5;
            if (number <= 86) return 6;
            return 7;
        }

        // 获取族
        function getGroup(number) {
            if (number === 1 || number === 3 || number === 11 || number === 19 || 
                number === 37 || number === 55 || number === 87) return 1;
            if (number === 4 || number === 12 || number === 20 || number === 38 || 
                number === 56 || number === 88) return 2;
            if (number >= 21 && number <= 30) return 3;
            if (number >= 39 && number <= 48) return 4;
            if (number >= 72 && number <= 80) return 5;
            if (number >= 104 && number <= 112) return 6;
            if (number === 5 || number === 13 || number === 31 || number === 49 || 
                number === 81 || number === 113) return 13;
            if (number === 6 || number === 14 || number === 32 || number === 50 || 
                number === 82 || number === 114) return 14;
            if (number === 7 || number === 15 || number === 33 || number === 51 || 
                number === 83 || number === 115) return 15;
            if (number === 8 || number === 16 || number === 34 || number === 52 || 
                number === 84 || number === 116) return 16;
            if (number === 9 || number === 17 || number === 35 || number === 53 || 
                number === 85 || number === 117) return 17;
            if (number === 2 || number === 10 || number === 18 || number === 36 || 
                number === 54 || number === 86 || number === 118) return 18;
            return "镧系/锕系";
        }

        // 获取电子排布（简化版）
        function getElectronConfig(number) {
            const configs = {
                1: "1s¹",
                2: "1s²",
                3: "1s² 2s¹",
                6: "1s² 2s² 2p²",
                7: "1s² 2s² 2p³",
                8: "1s² 2s² 2p⁴",
                11: "1s² 2s² 2p⁶ 3s¹",
                17: "1s² 2s² 2p⁶ 3s² 3p⁵",
                18: "1s² 2s² 2p⁶ 3s² 3p⁶",
                19: "1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹",
                26: "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁶",
                29: "1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ 3d¹⁰",
                36: "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁶"
            };
            return configs[number] || "复杂电子排布";
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 随机颜色按钮
            document.getElementById('randomize').addEventListener('click', function() {
                const elements = document.querySelectorAll('.element');
                elements.forEach(el => {
                    const randomColor = `hsl(${Math.random() * 360}, 70%, 60%)`;
                    el.style.backgroundColor = randomColor;
                });
            });

            // 动态效果按钮
            document.getElementById('animate').addEventListener('click', function() {
                const elements = document.querySelectorAll('.element');
                elements.forEach(el => {
                    el.classList.toggle('animation');
                });
            });

            // 重置按钮
            document.getElementById('reset').addEventListener('click', function() {
                renderPeriodicTable();
                document.getElementById('detailsPanel').style.display = 'none';
            });

            // 搜索功能
            document.getElementById('search').addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                const elements = document.querySelectorAll('.element');
                
                elements.forEach(el => {
                    const symbol = el.querySelector('.element-symbol').textContent.toLowerCase();
                    const name = el.querySelector('.element-name').textContent.toLowerCase();
                    
                    if (symbol.includes(searchTerm) || name.includes(searchTerm)) {
                        el.style.opacity = '1';
                        el.style.transform = 'scale(1.1)';
                    } else {
                        el.style.opacity = '0.3';
                        el.style.transform = 'scale(0.9)';
                    }
                });
            });
        }
    </script>
</body>
